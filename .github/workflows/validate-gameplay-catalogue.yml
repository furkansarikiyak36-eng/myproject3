name: Validate gameplay catalogues

on:
  push:
    branches:
      - main
      - 'planning/**'
      - 'phase-*'
      - 'mechanic-detailing-*'
      - 'feature/**'
    paths:
      - 'Docs/Architecture/**'
      - 'Tools/Validation/**'
      - '.github/workflows/validate-gameplay-catalogue.yml'
  pull_request:
    paths:
      - 'Docs/Architecture/**'
      - 'Tools/Validation/**'
      - '.github/workflows/validate-gameplay-catalogue.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-catalogue:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator
        run: python -m pip install -r Tools/Validation/requirements-catalogue.txt
      - name: Validate schemas, samples and mechanic registry
        run: python Tools/Validation/validate_gameplay_catalogue.py
